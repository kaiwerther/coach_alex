<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Coach Alex</title>
<link rel="icon" href="/favicon.png" type="image/png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<style>
  body { display: flex; justify-content: center; background:
    radial-gradient(1200px 600px at 50% -10%, #eef0fe 0%, var(--bg) 55%); }
  .app { width: 100%; max-width: 680px; height: 100dvh; display: flex; flex-direction: column;
         background: var(--panel); box-shadow: var(--sh-md); }
  @media (min-width: 720px) {
    .app { height: min(100dvh, 900px); margin: auto; border-radius: var(--r-lg); overflow: hidden;
           border: 1px solid var(--line); }
  }

  header { display: flex; align-items: center; gap: 13px; padding: 15px 20px;
           border-bottom: 1px solid var(--line); background: #fff; }
  header .avatar { width: 44px; height: 44px; font-size: 17px; }
  .who .name { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .who .status { font-size: 12.5px; color: var(--ok); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
  .who .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok);
                         box-shadow: 0 0 0 3px var(--ok-soft); }

  #log { flex: 1; overflow-y: auto; padding: 22px 20px; display: flex; flex-direction: column; gap: 3px; }
  .row { display: flex; margin-top: 9px; }
  .row.me { justify-content: flex-end; }
  .bubble { max-width: 76%; padding: 11px 15px; font-size: 15px; line-height: 1.45;
            white-space: pre-wrap; word-wrap: break-word; animation: rise .22s ease; }
  .them .bubble { background: #fff; border: 1px solid var(--line); color: var(--ink);
                  border-radius: 18px 18px 18px 5px; box-shadow: var(--sh-sm); }
  .me .bubble { background: var(--brand-grad); color: #fff; border-radius: 18px 18px 5px 18px;
                box-shadow: 0 4px 14px rgba(79, 70, 229, .28); }

  .typing .bubble { background: #fff; border: 1px solid var(--line); border-radius: 18px 18px 18px 5px;
                    padding: 15px 17px; box-shadow: var(--sh-sm); }

  .composer { padding: 14px 16px 18px; border-top: 1px solid var(--line); background: #fff; }
  .composer form { display: flex; gap: 10px; align-items: flex-end;
                   background: var(--line-2); border: 1px solid var(--line); border-radius: var(--r-lg);
                   padding: 6px 6px 6px 8px; transition: border-color .15s, box-shadow .15s; }
  .composer form:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(79,70,229,.12); background: #fff; }
  textarea#input { flex: 1; resize: none; border: none; background: transparent; font: inherit;
                   padding: 8px 6px; max-height: 140px; color: var(--ink); }
  textarea#input:focus { outline: none; }
  .send { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; flex: none;
          background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center;
          transition: background .15s, transform .05s; box-shadow: 0 3px 10px rgba(79,70,229,.3); }
  .send:hover:not(:disabled) { background: var(--brand-strong); }
  .send:active { transform: scale(.94); }
  .send:disabled { opacity: .4; cursor: default; box-shadow: none; }

  .empty { margin: auto; text-align: center; color: var(--muted); padding: 40px; max-width: 320px; }
  .empty .avatar { width: 62px; height: 62px; font-size: 24px; margin: 0 auto 16px; }
  .empty h2 { color: var(--ink); font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  .empty p { margin: 0; font-size: 14px; line-height: 1.5; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">A</div>
    <div class="who">
      <div class="name">Coach Alex</div>
      <div class="status" id="status">Online</div>
    </div>
  </header>
  <div id="log"></div>
  <div class="composer">
    <form id="form">
      <textarea id="input" rows="1" placeholder="Nachricht schreiben…" autocomplete="off"></textarea>
      <button id="send" class="send" type="submit" aria-label="Senden">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12l15-7-6 15-2.5-6L4 12z" fill="currentColor"/></svg>
      </button>
    </form>
  </div>
</div>
<script>
const params = new URLSearchParams(location.search);
const c = params.get("c");
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusEl = document.getElementById("status");
let lastId = 0;
let pendingEchoes = 0; // optimistically-rendered user messages awaiting server echo
let lastRole = null;   // role of the most recent message (drives the typing indicator)
let typingEl = null;

if (!c) {
  document.querySelector(".app").innerHTML =
    '<div class="empty"><div class="avatar">A</div><h2>Link unvollständig</h2>' +
    '<p>Dieser Chat-Link scheint ungültig zu sein. Bitte öffne den Einladungslink genau so, wie du ihn erhalten hast.</p></div>';
  throw new Error("no conversation");
}

function showEmptyState() {
  if (log.querySelector(".row") || document.getElementById("emptyState")) return;
  const d = document.createElement("div");
  d.className = "empty"; d.id = "emptyState";
  d.innerHTML = '<div class="avatar">A</div><h2>Sag Hallo 👋</h2>' +
    '<p>Coach Alex ist für dich da. Schreibe eine Nachricht, um das Gespräch zu beginnen.</p>';
  log.appendChild(d);
}
function clearEmptyState() { const e = document.getElementById("emptyState"); if (e) e.remove(); }

function addBubble(role, content) {
  clearEmptyState();
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "me" : "them");
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = content;
  row.appendChild(b);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return row;
}

// Typing indicator: shown whenever the participant is waiting for a reply
// (i.e. the latest message is theirs). Identical for AI and human modes, so it
// never reveals which one is answering. Always kept at the bottom of the log.
function setTyping(on) {
  if (on) {
    clearEmptyState();
    if (!typingEl) {
      typingEl = document.createElement("div");
      typingEl.className = "row them typing";
      typingEl.innerHTML = '<div class="bubble"><span class="dots"><i></i><i></i><i></i></span></div>';
    }
    log.appendChild(typingEl); // move to bottom
    log.scrollTop = log.scrollHeight;
  } else if (typingEl) {
    typingEl.remove();
    typingEl = null;
  }
}

async function poll() {
  try {
    const r = await fetch(`/api/chat?c=${encodeURIComponent(c)}&after=${lastId}`);
    if (r.status === 404) { statusEl.textContent = "nicht verfügbar"; return; }
    const data = await r.json();
    for (const m of data.messages || []) {
      lastId = Math.max(lastId, m.id);
      if (m.role === "user" && pendingEchoes > 0) { pendingEchoes--; lastRole = "user"; continue; }
      setTyping(false);
      addBubble(m.role, m.content);
      lastRole = m.role;
    }
    setTyping(lastRole === "user");
    if (!log.querySelector(".row") && !typingEl) showEmptyState();
  } catch (e) { /* transient */ }
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  input.style.height = "auto";
  sendBtn.disabled = true;
  addBubble("user", text);
  lastRole = "user";
  pendingEchoes++;
  setTyping(true); // show immediately, before the reply arrives
  try {
    await fetch("/api/chat", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ c, content: text }),
    });
    await poll();
  } catch (e) {}
  input.focus();
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
  sendBtn.disabled = input.value.trim().length === 0;
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
});

sendBtn.disabled = true;
showEmptyState();
poll();
setInterval(poll, 2500);
</script>
</body>
</html>
